<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - SANCHAY IAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container fade-in-up">
            <div class="glass-card">
                <div class="brand-header">
                    <span class="portal-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--success);">Client Portal</span>
                    <h1>Welcome Back</h1>
                    <p>Track your goals and portfolios in real-time.</p>
                </div>

                <div id="alert-box" class="alert alert-error"></div>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="input-control" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="login-btn" style="background: var(--success); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);">Log In</button>
                </form>
                
                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="advisor_login.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.875rem;">Are you an advisor? Click here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const alertBox = document.getElementById('alert-box');
            btn.textContent = 'Logging in...';
            btn.disabled = true;
            
            try {
                const response = await fetch(window.SANCHAY_CONFIG.getAPIUrl('/auth/login'), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.detail || 'Login failed');
                if (data.role !== 'client') throw new Error('This portal is for clients only.');
                
                // Store token and role
                localStorage.setItem('sanchay_token', data.access_token);
                localStorage.setItem('sanchay_role', data.role);
                localStorage.setItem('sanchay_name', data.name);
                
                // Redirect
                window.location.href = 'client_portal.html';
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.style.display = 'block';
                btn.textContent = 'Log In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
