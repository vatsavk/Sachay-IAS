<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SANCHAY - Add Client Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit {
      background: #667eea;
      color: white;
    }
    .btn-submit:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-cancel {
      background: #f0f0f0;
      color: #333;
    }
    .btn-cancel:hover {
      background: #e0e0e0;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
    .clients-list {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid #eee;
    }
    .clients-list h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }
    .client-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .client-name {
      font-weight: 600;
      color: #333;
    }
    .client-info {
      color: #999;
      font-size: 12px;
    }
    .btn-refresh {
      background: #28a745;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
      margin-top: 15px;
      width: 100%;
    }
    .btn-refresh:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Add Client</h1>
    <p class="subtitle">SANCHAY IAS - Quick Client Creation Test</p>
    
    <div id="status" class="status"></div>
    
    <form id="clientForm">
      <div class="form-group">
        <label>Client Name *</label>
        <input type="text" id="name" placeholder="e.g., Rahul Sharma" required>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob" value="1985-03-15">
        </div>
        <div class="form-group">
          <label>Occupation</label>
          <input type="text" id="occupation" placeholder="e.g., Engineer">
        </div>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Annual Income (₹)</label>
          <input type="number" id="income" placeholder="2500000" value="2500000">
        </div>
        <div class="form-group">
          <label>Net Worth (₹)</label>
          <input type="number" id="netWorth" placeholder="15000000" value="15000000">
        </div>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>User ID *</label>
          <input type="number" id="userId" placeholder="1" value="1" required>
        </div>
        <div class="form-group">
          <label>Advisor ID</label>
          <input type="number" id="advisorId" placeholder="1" value="1">
        </div>
      </div>
      
      <div class="form-group">
        <label>Onboarding Date</label>
        <input type="date" id="onboardingDate" value="2024-01-15">
      </div>
      
      <div class="buttons">
        <button type="button" class="btn-cancel" onclick="resetForm()">Clear</button>
        <button type="submit" class="btn-submit">➕ Add Client</button>
      </div>
    </form>
    
    <button class="btn-refresh" onclick="loadClients()">🔄 Refresh Client List</button>
    
    <div class="clients-list" id="clientsList" style="display:none;">
      <h2>Clients in Database:</h2>
      <div id="clientsContainer">Loading...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  
  <script>
    const form = document.getElementById('clientForm');
    const statusEl = document.getElementById('status');
    
    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      if (type === 'success') {
        setTimeout(() => statusEl.style.display = 'none', 5000);
      }
    }
    
    async function handleSubmit(e) {
      e.preventDefault();
      
      try {
        showStatus('🔄 Creating client...', 'loading');
        
        const clientData = {
          name: document.getElementById('name').value,
          user_id: parseInt(document.getElementById('userId').value),
          advisor_id: parseInt(document.getElementById('advisorId').value) || null,
          dob: document.getElementById('dob').value,
          income: parseFloat(document.getElementById('income').value),
          net_worth: parseFloat(document.getElementById('netWorth').value),
          occupation: document.getElementById('occupation').value,
          onboarding_date: document.getElementById('onboardingDate').value
        };
        
        console.log('Submitting client data:', clientData);
        
        // Use the global function we created
        const result = await window.createClientAndRefresh(clientData);
        
        if (result && result.client_id) {
          showStatus(`✅ Client created successfully! ID: ${result.client_id}`, 'success');
          resetForm();
          await loadClients();
        } else {
          showStatus('❌ Failed to create client', 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showStatus(`❌ Error: ${error.message}`, 'error');
      }
    }
    
    function resetForm() {
      form.reset();
      statusEl.style.display = 'none';
    }
    
    async function loadClients() {
      try {
        const response = await window.apiFetch('/clients');
        
        if (response && Array.isArray(response)) {
          const listEl = document.getElementById('clientsList');
          const containerEl = document.getElementById('clientsContainer');
          
          if (response.length === 0) {
            containerEl.innerHTML = '<p style="color:#999;font-size:13px;">No clients found</p>';
          } else {
            containerEl.innerHTML = response.map(client => `
              <div class="client-item">
                <div>
                  <div class="client-name">${client.name || 'Unknown'}</div>
                  <div class="client-info">
                    ID: ${client.client_id} | Net Worth: ₹${(client.net_worth || 0).toLocaleString('en-IN')}
                  </div>
                </div>
              </div>
            `).join('');
          }
          
          listEl.style.display = 'block';
        }
      } catch (error) {
        console.error('Error loading clients:', error);
      }
    }
    
    form.addEventListener('submit', handleSubmit);
    
    // Load clients on page load
    window.addEventListener('load', async () => {
      console.log('Page loaded, initializing...');
      await new Promise(r => setTimeout(r, 1000)); // Wait for app.js to initialize
      await loadClients();
    });
  </script>
</body>
</html>
